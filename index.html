<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Phonics Puzzle</title>
<link rel="stylesheet" href="css/font.css?v=54832f73">
<link rel="stylesheet" href="css/font-ko.css?v=fa5b8de1">
<link rel="stylesheet" href="css/style.css?v=2c24fc90">
</head>
<body>
<div id="app" data-screen="title">
  <div class="bg" aria-hidden="true"></div>
  <div class="title-el title-stars" id="titleStars" aria-hidden="true"></div>

  <div id="stage">
    <!-- title -->
    <div class="title-el logo-wrap" id="logoWrap"><div class="logo-float"><i class="logo-glow" aria-hidden="true"></i><img class="logo" src="assets/img/logo.webp" alt="Phonics Puzzle" draggable="false"><i class="logo-shine" aria-hidden="true"></i></div></div>
    <button class="title-el start" id="btnStart" aria-label="Start"><img src="assets/img/start.webp" alt="" draggable="false"><i class="shine"></i></button>
    <img class="title-el hand-cue" id="titleHand" src="assets/img/hand.webp" alt="" draggable="false">

    <!-- game -->
    <img class="game-el game-logo" id="gameLogo" src="assets/img/logo.webp" alt="" draggable="false">
    <div class="game-el frame" id="frame">
      <div class="lights" id="lights" aria-hidden="true"></div>
      <div class="board" id="board">
        <canvas id="ghost"></canvas>
        <div id="placed"></div>
        <canvas id="full"></canvas>
        <canvas id="hint"></canvas>
        <i class="sweep" aria-hidden="true"></i>
      </div>
    </div>
    <div class="game-el tray" id="tray">
      <div class="tray-tab">PIECES</div>
      <button class="tray-btn up" id="btnUp" aria-label="Up"><img src="assets/img/ui/up.webp" alt="" draggable="false"></button>
      <div class="tray-view" id="trayView"><div class="tray-list" id="trayList"></div></div>
      <div class="tray-dots" id="trayDots" aria-hidden="true"></div>
      <button class="tray-btn down" id="btnDown" aria-label="Down"><img src="assets/img/ui/down.webp" alt="" draggable="false"></button>
      <span class="tray-label">DOWN</span>
    </div>
    <div class="game-el wordbar" id="wordBar" aria-live="polite"></div>
    <button class="game-el next-btn" id="btnNext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5.5 16.5 12 9 18.5"/></svg></button>
    <img class="game-el hand-cue game-hand" id="gameHand" src="assets/img/hand.webp" alt="" draggable="false">
  </div>

  <!-- screen-edge HUD (Toy Catch's top bar: --hb high, 3 u from the edges) — the art is the user's sheet
       design/puzzle_assets.png, cut by tools/cut_buttons.py; score and level are written live on the blank ribbons -->
  <div class="hud-left game-el">
    <button class="imgbtn pill" id="btnHomeTop" aria-label="Home"><img src="assets/img/ui/home.webp" alt="" draggable="false"></button>
    <div class="score-rib" id="scorePill"><img src="assets/img/ui/score.webp" alt="" draggable="false"><b id="score" data-t="0">0</b></div>
  </div>
  <!-- phonics-api key (title only): a teacher enters it once per device; dot mint = the company server judges, sand = on-device -->
  <div class="sys sys-left title-el">
    <button class="imgbtn round key" id="btnKey" aria-label="발음 인식 서버 키" data-api="unknown"><img src="assets/img/ui/round.webp" alt="" draggable="false"><svg class="ico" viewBox="0 0 24 24"><g class="e"><circle cx="8" cy="12" r="3.8"/><path d="M11.8 12H20.5M17.4 12v3.2M20.5 12v2.6"/></g><g class="c"><circle cx="8" cy="12" r="3.8"/><path d="M11.8 12H20.5M17.4 12v3.2M20.5 12v2.6"/></g></svg><i class="dot"></i></button>
  </div>
  <div class="sys">
    <div class="level-rib game-el" id="levelBadge"><img src="assets/img/ui/level.webp" alt="" draggable="false"><b id="levelTxt" data-t="1-1">1-1</b></div>
    <button class="imgbtn pill game-el" id="btnRestart" aria-label="Restart"><img src="assets/img/ui/restart.webp" alt="" draggable="false"></button>
    <div class="flags title-el" id="btnLang" role="group" aria-label="Voice language">
      <button class="imgbtn round flagbtn" data-l="en" aria-label="English"><img src="assets/img/ui/flag_en.webp" alt="" draggable="false"></button>
      <button class="imgbtn round flagbtn" data-l="ko" aria-label="한국어"><img src="assets/img/ui/flag_ko.webp" alt="" draggable="false"></button>
    </div>
    <button class="imgbtn round" id="btnSound" aria-label="Sound"><img src="assets/img/ui/sound.webp" alt="" draggable="false"></button>
    <button class="imgbtn round title-el" id="btnExit" aria-label="Exit"><img src="assets/img/ui/round.webp" alt="" draggable="false"><svg class="ico" viewBox="0 0 24 24"><g class="e"><path d="M10.5 4.5H7A2.5 2.5 0 0 0 4.5 7v10A2.5 2.5 0 0 0 7 19.5h3.5"/><path d="M14 8l4 4-4 4M18 12H9.5"/></g><g class="c"><path d="M10.5 4.5H7A2.5 2.5 0 0 0 4.5 7v10A2.5 2.5 0 0 0 7 19.5h3.5"/><path d="M14 8l4 4-4 4M18 12H9.5"/></g></svg></button>
  </div>

  <div id="drag" aria-hidden="true"></div>
  <div class="burst-layer" id="bursts" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- level clear / all clear -->
  <div class="overlay" id="clear" aria-live="polite">
    <div class="clear-card">
      <div class="clear-stars"><i></i><i></i><i></i></div>
      <div class="clear-title" id="clearTitle">LEVEL 1 CLEAR!</div>
      <div class="clear-pics" id="clearPics"></div>
      <div class="clear-score"><svg class="trophy" viewBox="0 0 48 48" aria-hidden="true"><path class="cup" d="M14 6h20v9c0 7-4.5 12-10 12S14 22 14 15z"/><path class="ear" d="M14 9H8.5c0 6 2.5 9.5 6.5 10M34 9h5.5c0 6-2.5 9.5-6.5 10"/><path class="cup" d="M20.5 26.5h7l1 7h-9z"/><rect class="cup" x="14.5" y="33" width="19" height="6" rx="2.5"/><path class="star" d="m24 10.5 1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z"/></svg><b id="clearScore">0</b></div>
      <div class="clear-btns">
        <button class="imgbtn pill" id="btnHome" aria-label="Home"><img src="assets/img/ui/home.webp" alt="" draggable="false"></button>
        <button class="pill-btn go" id="btnGo" aria-label="Next level"><span id="goTxt">Next</span><svg viewBox="0 0 24 24"><path d="M9 5.5 16.5 12 9 18.5"/></svg></button>
      </div>
    </div>
  </div>
</div>

<script src="js/words.js?v=1077ea2c"></script>
<script src="js/voice.js?v=c83b5456"></script>
<script src="js/voice-data.js?v=bca6b44c"></script>
<script src="js/bgm-data.js?v=132deac0" onerror="void 0"></script>
<script src="js/audio.js?v=6a84eb51"></script>
<script src="js/mic.js?v=f986de63"></script>
<script src="js/phonics-api.js?v=987872ed"></script>
<script src="js/stt.js?v=4855644a"></script>
<script src="js/jigsaw.js?v=29a15bda"></script>
<script src="js/fx.js?v=544abfc9"></script>
<script src="js/game.js?v=b1a616ed"></script>
</body>
</html>
