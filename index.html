<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Phonics Puzzle</title>
<link rel="stylesheet" href="css/font.css?v=54832f73">
<link rel="stylesheet" href="css/font-ko.css?v=fa5b8de1">
<link rel="stylesheet" href="css/style.css?v=5cd9ee58">
</head>
<body>
<div id="app" data-screen="title">
  <div class="bg" aria-hidden="true"></div>
  <div class="title-el title-stars" id="titleStars" aria-hidden="true"></div>
  <div class="bubbles" id="bubbles" aria-hidden="true"></div>

  <div id="stage">
    <!-- title -->
    <div class="title-el logo-wrap" id="logoWrap"><div class="logo-float"><i class="logo-glow" aria-hidden="true"></i><img class="logo" src="assets/img/logo.webp" alt="Phonics Puzzle" draggable="false"><i class="logo-shine" aria-hidden="true"></i></div></div>
    <!-- my sticker wall: stickers from MY STICKERS stuck anywhere on the title (user: "스티커를 모은건 화면에 붙일수 있게… 자유롭게 꾸밀수 있게");
         over the logo, under START; moved / turned / sized / peeled off in decorate mode (game.js decor) -->
    <div class="title-el decor-wall" id="decor"></div>
    <button class="title-el start" id="btnStart" aria-label="Start"><img src="assets/img/start.webp" alt="" draggable="false"><i class="shine"></i></button>
    <div class="lvmenu" id="lvMenu" aria-hidden="true"><div class="lm-panel" role="dialog" aria-label="Levels"></div></div>
    <img class="title-el hand-cue" id="titleHand" src="assets/img/hand.webp" alt="" draggable="false">
    <div class="title-el decor-tray" id="decorTray"><div class="decor-list" id="decorList"></div>
      <button class="decor-done" id="btnDecorDone" aria-label="Done"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button></div>

    <!-- game -->
    <img class="game-el game-logo" id="gameLogo" src="assets/img/logo.webp" alt="" draggable="false">
    <!-- the level on a tab on the board's top edge (user picked C of three; kept on the top edge) -->
    <button class="game-el board-tab" id="boardTab" aria-haspopup="true" aria-expanded="false" aria-label="Level 1"><small>LEVEL</small><b id="boardTabTxt">1-1</b><svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 9.5 12 15l5.5-5.5"/></svg></button>
    <!-- the tutor (the user's bunny), left of the board, pointing at it: layers from tools/build_tutor.py (ears behind the body
         so they can wiggle) + new SVG eyes (white, iris, light) that blink and look at the pieces -->
    <div class="game-el tutor" id="tutor">
      <svg class="tutor-shadow" viewBox="0 0 816 1248" aria-hidden="true"><defs><filter id="tShadowBlur" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="7"/></filter></defs>
        <g filter="url(#tShadowBlur)"><ellipse cx="340" cy="1236" rx="250" ry="24" fill="#2a1e46" opacity=".16"/><ellipse cx="212" cy="1240" rx="86" ry="15" fill="#2a1e46" opacity=".34"/><ellipse cx="465" cy="1220" rx="76" ry="13" fill="#2a1e46" opacity=".3"/></g></svg>
      <div class="rig"><img class="ear ear-l" src="assets/img/tutor_ear_l.webp" alt="" draggable="false"><img class="ear ear-r" src="assets/img/tutor_ear_r.webp" alt="" draggable="false"><img class="body" src="assets/img/tutor_base.webp" alt="" draggable="false"><img class="brow brow-l" src="assets/img/tutor_brow_l.webp" alt="" draggable="false"><img class="brow brow-r" src="assets/img/tutor_brow_r.webp" alt="" draggable="false">
        <svg class="face" viewBox="0 0 816 1248" aria-hidden="true"><defs>
        <radialGradient id="tEyeW" cx="45%" cy="40%" r="62%"><stop offset="0" stop-color="#ffffff"/><stop offset=".72" stop-color="#fbf7f2"/><stop offset="1" stop-color="#e9ddd2"/></radialGradient>
        <radialGradient id="tIris" cx="42%" cy="62%" r="62%"><stop offset="0" stop-color="#a86f3e"/><stop offset=".55" stop-color="#5e3418"/><stop offset="1" stop-color="#2a1408"/></radialGradient>
        <linearGradient id="tLidShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a2c" stop-opacity=".28"/><stop offset=".32" stop-color="#7a4a2c" stop-opacity="0"/></linearGradient>
        <clipPath id="tEyeClip"><ellipse rx="33" ry="38"/></clipPath>
        <linearGradient id="tMouthIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f0f08"/><stop offset=".45" stop-color="#7c2015"/><stop offset="1" stop-color="#a83f30"/></linearGradient>
        <radialGradient id="tTongue" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#f6a08a"/><stop offset=".6" stop-color="#e57a62"/><stop offset="1" stop-color="#c85a46"/></radialGradient>
        <linearGradient id="tTooth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".8" stop-color="#f3efe9"/><stop offset="1" stop-color="#d9d2c9"/></linearGradient>
        <clipPath id="tMouthClip"><path id="tMouthClipPath" d=""/></clipPath></defs>
        <!-- the mouth, drawn (game.js tutorMouth): its shape follows the voice and the face -->
        <g class="mouth">
          <path class="m-shade" d="" fill="none" stroke="#b9805a" stroke-opacity=".35" stroke-width="7" stroke-linecap="round"/>
          <path class="m-in" d="" fill="url(#tMouthIn)"/>
          <g clip-path="url(#tMouthClip)">
            <ellipse class="m-tongue" cx="446" cy="630" rx="36" ry="28" fill="url(#tTongue)"/>
            <rect class="m-tooth" x="0" y="0" width="21" height="26" rx="6" fill="url(#tTooth)" stroke="#cfc6bb" stroke-width="1.2"/>
            <rect class="m-tooth" x="0" y="0" width="21" height="26" rx="6" fill="url(#tTooth)" stroke="#cfc6bb" stroke-width="1.2"/>
          </g>
          <path class="m-rim" d="" fill="none" stroke="#5e1a10" stroke-opacity=".7" stroke-width="3.2" stroke-linejoin="round"/>
          <path class="m-lip" d="" fill="none" stroke="#ffc9ad" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g class="eye eye-l" transform="translate(331 490)"><g class="open"><ellipse rx="33" ry="38" fill="url(#tEyeW)" stroke="#7a4a2c" stroke-opacity=".38" stroke-width="2.4"/>
          <g clip-path="url(#tEyeClip)">
            <g class="iris"><ellipse rx="22.5" ry="24.5" fill="url(#tIris)"/><ellipse rx="11" ry="12.5" fill="#1d0f07"/>
              <ellipse cx="8.5" cy="-10" rx="7.5" ry="5.6" fill="#fff" opacity=".95" transform="rotate(-22 8.5 -10)"/><circle cx="-8" cy="9.5" r="3.2" fill="#fff" opacity=".8"/></g>
            <rect x="-35" y="-40" width="70" height="80" fill="url(#tLidShade)"/>
          </g></g>
          <path class="lash" d="M-27 4Q0 19 27 4" fill="none" stroke="#5a3320" stroke-width="4.5" stroke-linecap="round"/>
          <path class="happy" d="M-28 11Q0 -24 28 11" fill="none" stroke="#4a2a18" stroke-width="9.5" stroke-linecap="round"/></g>
        <g class="eye eye-r" transform="translate(516 467) scale(.86 .93)"><g class="open"><ellipse rx="33" ry="38" fill="url(#tEyeW)" stroke="#7a4a2c" stroke-opacity=".38" stroke-width="2.4"/>
          <g clip-path="url(#tEyeClip)">
            <g class="iris"><ellipse rx="22.5" ry="24.5" fill="url(#tIris)"/><ellipse rx="11" ry="12.5" fill="#1d0f07"/>
              <ellipse cx="8.5" cy="-10" rx="7.5" ry="5.6" fill="#fff" opacity=".95" transform="rotate(-22 8.5 -10)"/><circle cx="-8" cy="9.5" r="3.2" fill="#fff" opacity=".8"/></g>
            <rect x="-35" y="-40" width="70" height="80" fill="url(#tLidShade)"/>
          </g></g>
          <path class="lash" d="M-27 4Q0 19 27 4" fill="none" stroke="#5a3320" stroke-width="4.5" stroke-linecap="round"/>
          <path class="happy" d="M-28 11Q0 -24 28 11" fill="none" stroke="#4a2a18" stroke-width="9.5" stroke-linecap="round"/></g></svg></div>
    </div>
    <div class="game-el frame" id="frame">
      <div class="lights" id="lights" aria-hidden="true"></div>
      <div class="board" id="board">
        <canvas id="ghost"></canvas>
        <div id="placed"></div>
        <canvas id="full"></canvas>
        <canvas id="hint"></canvas>
        <i class="sweep" aria-hidden="true"></i>
      </div>
    </div>
    <div class="game-el tray" id="tray">
      <!-- the tab and the body are ONE outline (user: "타이틀이랑 붙였더니 매끄럽지가 않네") -->
      <svg class="tray-shape" viewBox="0 0 30 80.2" preserveAspectRatio="none" aria-hidden="true"><defs>
        <linearGradient id="trayFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--tray-top)"/><stop offset=".08" style="stop-color:var(--tray-hi)"/><stop offset=".42" style="stop-color:var(--tray)"/><stop offset="1" style="stop-color:var(--tray-lo)"/></linearGradient></defs>
        <path d="M8.1 0H21.9A2.6 2.6 0 0 1 24.5 2.6V3.2A2 2 0 0 0 26.5 5.2H26.8A3.2 3.2 0 0 1 30 8.4V76.8A3.4 3.4 0 0 1 26.6 80.2H3.4A3.4 3.4 0 0 1 0 76.8V8.4A3.2 3.2 0 0 1 3.2 5.2H3.5A2 2 0 0 0 5.5 3.2V2.6A2.6 2.6 0 0 1 8.1 0Z" fill="url(#trayFill)"/></svg>
      <div class="tray-tab">PIECES</div>
      <button class="tray-btn up" id="btnUp" aria-label="Up"><img src="assets/img/ui/up.webp" alt="" draggable="false"></button>
      <div class="tray-view" id="trayView"><div class="tray-list" id="trayList"></div></div>
      <div class="tray-dots" id="trayDots" aria-hidden="true"></div>
      <button class="tray-btn down" id="btnDown" aria-label="Down"><img src="assets/img/ui/down.webp" alt="" draggable="false"></button>
    </div>
    <div class="game-el wordbar" id="wordBar" aria-live="polite"></div>
    <button class="game-el next-btn" id="btnNext" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5.5 16.5 12 9 18.5"/></svg></button>
    <button class="game-el skip-btn" id="btnSkip" aria-label="Skip">SKIP</button>   <!-- only while the explanation runs (#app.explain) -->
    <img class="game-el hand-cue game-hand" id="gameHand" src="assets/img/hand.webp" alt="" draggable="false">
  </div>

  <!-- screen-edge HUD (Toy Catch's top bar: --hb high, 3 u from the edges) — the art is the user's sheet
       design/puzzle_assets.png, cut by tools/cut_buttons.py; score and level are written live on the blank ribbons -->
  <div class="hud-left game-el">
    <div class="score-box" id="scorePill"><img class="trophy-img star-ico" src="assets/img/ui/clear_star.svg" alt="" draggable="false"><b id="score" data-t="0">0</b><span class="pic-stars" id="picStars" aria-hidden="true"><i></i><i></i><i></i></span></div>
  </div>
  <!-- phonics-api key (title only): a teacher enters it once per device; dot mint = the company server judges, sand = on-device -->
  <div class="sys sys-left title-el">
    <button class="sysbtn key" id="btnKey" aria-label="발음 인식 서버 키" data-api="unknown"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="12" r="3.6"/><path d="M11.6 12H20.5M17.6 12v3.2M20.5 12v2.4"/></svg><i class="dot"></i></button>
    <button class="sysbtn book" id="btnBook" aria-label="My stickers"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H19v-5"/><path d="m11.5 7.2 1.1 2.2 2.4.35-1.75 1.7.4 2.4-2.15-1.13-2.15 1.13.4-2.4-1.75-1.7 2.4-.35z"/></svg></button>
  </div>
  <div class="sys">
    <button class="lang-tog title-el" id="btnLang" data-l="ko" aria-label="Voice language: English or Korean"><span class="knob"></span><span class="flag" data-l="en"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="flag-en"><circle cx="12" cy="12" r="12"/></clipPath></defs><g clip-path="url(#flag-en)"><rect width="24" height="24" fill="#fff"/><rect y="0" width="24" height="1.85" fill="#b22234"/><rect y="3.69" width="24" height="1.85" fill="#b22234"/><rect y="7.38" width="24" height="1.85" fill="#b22234"/><rect y="11.08" width="24" height="1.85" fill="#b22234"/><rect y="14.77" width="24" height="1.85" fill="#b22234"/><rect y="18.46" width="24" height="1.85" fill="#b22234"/><rect y="22.15" width="24" height="1.85" fill="#b22234"/><rect width="12" height="12.92" fill="#3c3b6e"/><g fill="#fff"><circle cx="1.6" cy="1.8" r=".7"/><circle cx="4.5" cy="1.8" r=".7"/><circle cx="7.4" cy="1.8" r=".7"/><circle cx="10.3" cy="1.8" r=".7"/><circle cx="3.05" cy="3.7" r=".7"/><circle cx="5.95" cy="3.7" r=".7"/><circle cx="8.85" cy="3.7" r=".7"/><circle cx="1.6" cy="5.6" r=".7"/><circle cx="4.5" cy="5.6" r=".7"/><circle cx="7.4" cy="5.6" r=".7"/><circle cx="10.3" cy="5.6" r=".7"/><circle cx="3.05" cy="7.5" r=".7"/><circle cx="5.95" cy="7.5" r=".7"/><circle cx="8.85" cy="7.5" r=".7"/><circle cx="1.6" cy="9.4" r=".7"/><circle cx="4.5" cy="9.4" r=".7"/><circle cx="7.4" cy="9.4" r=".7"/><circle cx="10.3" cy="9.4" r=".7"/><circle cx="3.05" cy="11.3" r=".7"/><circle cx="5.95" cy="11.3" r=".7"/><circle cx="8.85" cy="11.3" r=".7"/></g></g></svg></span><span class="flag" data-l="ko"><svg viewBox="-12 -12 24 24" aria-hidden="true"><defs><clipPath id="flag-ko"><circle r="12"/></clipPath></defs><g clip-path="url(#flag-ko)"><rect x="-18" y="-12" width="36" height="24" fill="#fff"/><g transform="rotate(33.69)"><path d="M-6 0a6 6 0 0 1 12 0 3 3 0 0 0-6 0 3 3 0 0 1-6 0z" fill="#cd2e3a"/><path d="M-6 0a6 6 0 0 0 12 0 3 3 0 0 0-6 0 3 3 0 0 1-6 0z" fill="#0047a0"/></g><g fill="#151515"><g transform="rotate(33.69) translate(-10.2 0)"><rect x="-1.55" y="-2.8" width=".9" height="5.6"/><rect x="-.15" y="-2.8" width=".9" height="5.6"/><rect x="1.25" y="-2.8" width=".9" height="5.6"/></g><g transform="rotate(33.69) translate(10.2 0)"><rect x="-2.2" y="-2.8" width=".9" height="2.5"/><rect x="-2.2" y=".3" width=".9" height="2.5"/><rect x="-.75" y="-2.8" width=".9" height="2.5"/><rect x="-.75" y=".3" width=".9" height="2.5"/><rect x=".7" y="-2.8" width=".9" height="2.5"/><rect x=".7" y=".3" width=".9" height="2.5"/></g><g transform="rotate(-33.69) translate(10.2 0)"><rect x="-2.2" y="-2.8" width=".9" height="2.5"/><rect x="-2.2" y=".3" width=".9" height="2.5"/><rect x="-.75" y="-2.8" width=".9" height="5.6"/><rect x=".7" y="-2.8" width=".9" height="2.5"/><rect x=".7" y=".3" width=".9" height="2.5"/></g><g transform="rotate(-33.69) translate(-10.2 0)"><rect x="-1.55" y="-2.8" width=".9" height="5.6"/><rect x="-.15" y="-2.8" width=".9" height="2.5"/><rect x="-.15" y=".3" width=".9" height="2.5"/><rect x="1.25" y="-2.8" width=".9" height="5.6"/></g></g></g></svg></span></button>
    <button class="sysbtn" id="btnSound" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.6L12 18.6V5.4L7.6 9.5z" fill="currentColor"/><g class="on"><path d="M15.4 8.6a4.6 4.6 0 0 1 0 6.8M17.9 6.2a8 8 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g><g class="off"><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></g></svg></button>
    <button class="sysbtn" id="btnExit" aria-label="Exit"><svg viewBox="0 0 24 24"><path d="M10 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20H10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M14 8l4 4-4 4M18 12H9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <div id="drag" aria-hidden="true"></div>
  <div class="burst-layer" id="bursts" aria-hidden="true"></div>
  <canvas id="candyfx" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- level clear / all clear -->
  <!-- level clear / all clear: the game's board frame (bulbs + candy stars) round a cream panel, 3D candy stars on top -->
  <div class="overlay" id="clear" aria-live="polite">
    <div class="clear-card">
      <div class="lights" id="clearLights" aria-hidden="true"></div>
      <div class="clear-panel">
        <div class="clear-title candy-txt" id="clearTitle">LEVEL 1 CLEAR!</div>
        <div class="clear-pics" id="clearPics"></div>
        <div class="clear-btns">
          <button class="pill-btn home" id="btnHome" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3.8 11.3 12 4.6l8.2 6.7"/><path d="M6.3 9.6v8.6c0 1 .8 1.8 1.8 1.8h7.8c1 0 1.8-.8 1.8-1.8V9.6"/><path d="M10.1 20v-4a1.9 1.9 0 0 1 3.8 0v4"/></svg><span>Home</span></button>
          <button class="pill-btn go" id="btnGo" aria-label="Next level"><span id="goTxt">Next</span><svg viewBox="0 0 24 24"><path d="M9 5.5 16.5 12 9 18.5"/></svg></button>
        </div>
      </div>
      <div class="clear-stars" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </div>
  <!-- my sticker book: every m-word picture finished becomes a sticker (gold edge with 3 stars); tap one to hear it -->
  <div class="overlay" id="book" aria-live="polite">
    <div class="clear-card book-card">
      <div class="lights" id="bookLights" aria-hidden="true"></div>
      <div class="clear-panel book-panel">
        <div class="book-head"><div class="clear-title candy-txt book-title" id="bookTitle">MY STICKERS</div></div>
        <div class="book-grid" id="bookGrid"></div>
        <div class="clear-btns book-btns"><button class="pill-btn go" id="btnDecor" aria-label="Decorate the title with stickers"><svg viewBox="0 0 24 24"><path d="M13.5 20.5H7A3.5 3.5 0 0 1 3.5 17V7A3.5 3.5 0 0 1 7 3.5h10A3.5 3.5 0 0 1 20.5 7v6.5"/><path d="M13.5 20.5c0-3.9 3.1-7 7-7z"/><path d="m10.5 7.6.9 1.9 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2-1.45-1.4 2-.3z"/></svg><span>Decorate</span></button></div>
      </div>
      <button class="sysbtn book-close" id="btnBookClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
</div>

<script src="js/words.js?v=1077ea2c"></script>
<script src="js/voice.js?v=20806203"></script>
<script src="js/voice-data.js?v=5db47ac1"></script>
<script src="js/bgm-data.js?v=21e1fe12" onerror="void 0"></script>
<script src="js/audio.js?v=a9dfa472"></script>
<script src="js/mic.js?v=f986de63"></script>
<script src="js/phonics-api.js?v=45656529"></script>
<script src="js/stt.js?v=0ca43af3"></script>
<script src="vendor/three.iife.js"></script>
<script src="js/candyfx.js?v=862b486b"></script>
<script src="js/jigsaw.js?v=9c864933"></script>
<script src="js/fx.js?v=78baa07e"></script>
<script src="js/phonics-progress.js?v=48b311dc"></script>
<script src="js/game.js?v=71df5419"></script>
</body>
</html>
