<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<!-- Phonics Puzzle result star: a chubby 3D candy star (the frame stars' look, deeper): side, bevel, glossy top -->
<defs>
 <linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f29a18"/><stop offset="1" stop-color="#c8650a"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset=".55" stop-color="#ffbf2e"/><stop offset="1" stop-color="#f09a16"/></linearGradient>
 <radialGradient id="top" cx="40%" cy="34%" r="68%"><stop offset="0" stop-color="#fffbd2"/><stop offset=".38" stop-color="#ffe055"/><stop offset=".8" stop-color="#ffc126"/><stop offset="1" stop-color="#f7a71c"/></radialGradient>
 <radialGradient id="hl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<polygon points="60.00,22.00 74.11,48.58 103.75,53.79 82.83,75.42 87.04,105.21 60.00,92.00 32.96,105.21 37.17,75.42 16.25,53.79 45.89,48.58" fill="url(#side)" stroke="url(#side)" stroke-width="16" stroke-linejoin="round"/>
<polygon points="60.00,14.00 74.11,40.58 103.75,45.79 82.83,67.42 87.04,97.21 60.00,84.00 32.96,97.21 37.17,67.42 16.25,45.79 45.89,40.58" fill="url(#rim)" stroke="url(#rim)" stroke-width="16" stroke-linejoin="round"/>
<polygon points="60.00,14.00 74.11,40.58 103.75,45.79 82.83,67.42 87.04,97.21 60.00,84.00 32.96,97.21 37.17,67.42 16.25,45.79 45.89,40.58" fill="url(#top)" stroke="url(#top)" stroke-width="14.6" stroke-linejoin="round"/>   <!-- rim shows ~1 px (user) -->
<ellipse cx="45" cy="41" rx="13" ry="7.5" fill="url(#hl)" transform="rotate(-30 45 41)"/>
<ellipse cx="43" cy="40" rx="6" ry="3.4" fill="#fff" opacity=".9" transform="rotate(-30 43 40)"/>
<circle cx="62" cy="27" r="3.2" fill="#fff" opacity=".8"/>
<circle cx="80" cy="74" r="2.2" fill="#fff" opacity=".55"/>
